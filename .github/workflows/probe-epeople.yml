name: probe-epeople

# 소스②가 러너에서 '완전 차단'인지 '스로틀링'인지 구분하는 정밀 측정.
# DNS → TCP → TLS 단계별 소요시간을 반복 측정해 실패 지점과 재현성을 본다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 단계별 연결 측정 (10회 반복)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import socket, ssl, time, statistics
          HOST = "www.epeople.go.kr"
          print("DNS:", socket.gethostbyname_ex(HOST)[2])
          tcp, tls, fails = [], [], 0
          for i in range(10):
              t0 = time.time()
              try:
                  s = socket.create_connection((HOST, 443), timeout=20)
                  t1 = time.time(); tcp.append(t1 - t0)
                  ctx = ssl.create_default_context()
                  ss = ctx.wrap_socket(s, server_hostname=HOST)
                  t2 = time.time(); tls.append(t2 - t1)
                  print(f"  {i+1:2d}: TCP {t1-t0:6.2f}s  TLS {t2-t1:6.2f}s  OK")
                  ss.close()
              except Exception as e:
                  fails += 1
                  print(f"  {i+1:2d}: FAIL after {time.time()-t0:6.2f}s  {type(e).__name__}: {e}")
              time.sleep(1)
          print(f"\n성공 {10-fails}/10 · 실패 {fails}")
          if tcp: print(f"TCP 중앙값 {statistics.median(tcp):.2f}s")
          if tls: print(f"TLS 중앙값 {statistics.median(tls):.2f}s  최대 {max(tls):.2f}s")
          PY

      - name: 실제 스크래퍼 (키워드 2개, 느린 지연)
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 scrape_epeople.py --keywords "방화구획" "건축 감리" \
            --pages 1 --new-only --no-snapshot --delay 3.0 || echo "EXIT=$? (실패)"
