name: update

# 매일 04:00 KST(= 19:00 UTC) 수집 → 분류 → 페이지 빌드 → Pages 배포.
#
# 왜 '주 1회'가 아니라 '매일'인가:
# 국토부·국민신문고는 GitHub 러너 IP를 간헐적으로 차단한다(실측: 같은 사이트가
# 07:38에는 2초 만에 응답, 07:54에는 5회 재시도가 전부 타임아웃). 차단은 제어할 수
# 없으므로, 실행을 잦게 해 '언젠가는 통과'하도록 만든다. --new-only 라서 재실행은
# 멱등하고 값싸며(신규 없으면 커밋도 없음), public 리포는 Actions 분당 요금이 없다.
#
# 두 소스는 continue-on-error로 서로 독립적이다. 한쪽이 막혀도 다른 쪽은 수집되고,
# 둘 다 막혀도 기존 데이터로 페이지를 다시 빌드·배포해 사이트는 항상 살아 있다.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  # 맥(한국 IP)에서 수집한 신규 데이터를 push하면 즉시 사이트에 반영한다.
  # 봇 커밋(GITHUB_TOKEN)은 워크플로를 재트리거하지 않으므로 순환하지 않는다.
  push:
    branches: [main]
    paths: ["qa/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 소스① 국토부 민원마당 (건축 전건, 신규만)
        id: molit
        continue-on-error: true
        run: python3 scrape_molit.py --all --new-only --delay 1.5

      - name: 소스② 국민신문고 (건축 키워드, 신규만)
        id: epeople
        continue-on-error: true
        run: python3 scrape_epeople.py --pages 5 --new-only --delay 1.5

      - name: 수집 결과 요약
        run: |
          M='${{ steps.molit.outcome }}'
          E='${{ steps.epeople.outcome }}'
          {
            echo "## 수집 결과"
            echo "- 소스① 국토부 민원마당: **$M**"
            echo "- 소스② 국민신문고: **$E**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$M" = failure ] && [ "$E" = failure ]; then
            echo "::warning::두 소스 모두 실패 — 러너 IP 차단으로 보임. 내일 실행에서 자동으로 다시 시도된다."
          fi

      - name: LLM 분류 (신규만 — 캐시된 건 건너뜀)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY 시크릿 없음 — LLM 분류 건너뜀"
          else
            python3 classify_llm.py --batch 25
          fi

      - name: 열람 페이지 빌드
        run: python3 build_browse.py

      - name: 신규 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qa/
          if git diff --cached --quiet; then
            echo "신규 항목 없음 — 커밋 생략"
          else
            git commit -m "자동 갱신: $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Pages 아티팩트 준비
        run: |
          mkdir -p _site
          cp qa/browse.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
