name: weekly-update

# 매주 월요일 04:00 KST(= 일요일 19:00 UTC)에 수집 → 분류 → 페이지 빌드 → Pages 배포.
# 맥의 launchd를 대체한다. 맥 전원·macOS 권한(TCC)과 무관하게 동작한다.
on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # 수집한 신규 MD·색인을 리포에 커밋
  pages: write      # 열람 페이지 배포
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 소스① 국토부 민원마당 (건축 전건, 신규만)
        run: python3 scrape_molit.py --all --new-only --delay 1.0

      - name: 소스② 국민신문고 (건축 키워드, 신규만)
        run: python3 scrape_epeople.py --pages 5 --new-only --delay 1.5

      - name: LLM 분류 (신규만 — 캐시된 건 건너뜀)
        # 키가 없으면 분류를 건너뛰고 계속 진행한다. build_browse가 캐시 없는 항목은
        # 키워드 분류로 대체하므로 파이프라인이 멈추지는 않는다.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY 시크릿 없음 — LLM 분류 건너뜀"
          else
            python3 classify_llm.py --batch 25
          fi

      - name: 열람 페이지 빌드
        run: python3 build_browse.py

      - name: 신규 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qa/
          if git diff --cached --quiet; then
            echo "신규 항목 없음 — 커밋 생략"
          else
            git commit -m "주간 갱신: $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Pages 아티팩트 준비
        run: |
          mkdir -p _site
          cp qa/browse.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
